name:                ontologic
version:             1.8.2
github:              "bsommers/OntoLogic"
license:             Apache-2.0
author:              "OntoLogic Team"
maintainer:          "bsommers"
copyright:           "2024 OntoLogic"

data-files:
- ontologic-lib/*.logic

dependencies:
- base >= 4.7 && < 5
- text
- containers
- megaparsec
- parser-combinators
- optparse-applicative
- directory
- filepath
- hashable
- process
- bytestring

library:
  source-dirs: src

executables:
  ontologic-exe:
    main:                Main.hs
    source-dirs:         src
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - ontologic
    - process

  ontologic-lsp:
    main:                Main.hs
    source-dirs:         app-lsp
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - ontologic
    - process

tests:
  ontologic-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - ontologic
    - hspec
    - megaparsec
    - QuickCheck
